<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الواجهة النهائية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f1f5f9; 
            padding: 20px;
            width: 480px;
            margin: auto;
            border-radius: 12px;
            user-select: none;
            min-height: 100vh;
        }

        /* 1. شريط الاشتراك باللون الأحمر */
        .subscription-banner {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.25) 0%, rgba(220, 38, 38, 0.35) 50%, rgba(239, 68, 68, 0.25) 100%);
            border: 1px solid rgba(239, 68, 68, 0.6);
            border-radius: 10px;
            padding: 8px 15px;
            display: flex; align-items: center; justify-content: space-between; 
            font-size: 12px; color: #fca5a5; margin-bottom: 15px;
        }
        .banner-days { 
            background: rgba(239, 68, 68, 0.35); border: 1px solid rgba(239, 68, 68, 0.7); 
            padding: 2px 8px; border-radius: 10px; color: #fff; font-weight: bold;
        }

        /* 2. الهيدر وشريط التنزيل الأوفلاين */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 2px solid rgba(255, 215, 0, 0.2); padding-bottom: 12px; margin-bottom: 15px; 
        }
        h2 { margin: 0; color: #ffd700; font-size: 16px; }

        .offline-sync-box {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 12px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .sync-btn {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #1e272e;
            border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 11px; transition: opacity 0.2s;
        }
        .sync-btn:hover { opacity: 0.9; }
        .progress-wrapper { width: 100%; text-align: center; }
        progress { width: 100%; height: 10px; border-radius: 5px; border: none; overflow: hidden; }
        progress::-webkit-progress-bar { background-color: rgba(15, 23, 42, 0.8); }
        progress::-webkit-progress-value { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .progress-text { font-size: 10px; color: #ffd700; font-weight: bold; display: block; margin-top: 3px; }

        /* 3. العناوين والأقسام */
        .category-title {
            color: #ffd700; font-size: 13px; margin: 15px 0 8px 0; border-right: 3px solid #ffd700; padding-right: 8px; font-weight: bold;
        }
        .cards-container {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;
        }

        /* 4. كارت الوحدة */
        .card { 
            background: rgba(30, 41, 59, 0.7); 
            border-radius: 12px; 
            padding: 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border: 1px solid rgba(255, 215, 0, 0.2); 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #ffd700;
            background: rgba(30, 41, 59, 0.95);
        }
        .card img { 
            width: 75px; height: 75px; object-fit: cover; border-radius: 8px; flex-shrink: 0;
            background: #0f172a;
        }
        .info { 
            flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
        }
        .info h3 { margin: 0; font-size: 14px; color: #f8fafc; }
        .info p { margin: 0 0 4px 0; font-size: 11px; color: #94a3b8; }
        
        button.dl-btn { 
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #1e272e; 
            border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; 
            font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. شريط التنبيه -->
    <div class="subscription-banner">
        <div>✨ أهلاً بك م/ محمد عادل 👑</div>
        <div class="banner-days">⚠️ باقي 5 أيام فقط!</div>
    </div>

    <!-- 2. الهيدر وزر تنزيل المكتبة أوفلاين -->
    <div class="header">
        <h2>مكتبة المطابخ</h2>
        
        <div class="offline-sync-box">
            <button id="syncBtn" class="sync-btn" onclick="downloadAllComponentsOffline()">تنزيل المكتبة للعمل بدون إنترنت 📥</button>
            
            <div id="progressWrapper" class="progress-wrapper" style="display: none;">
                <progress id="syncProgress" value="0" max="100"></progress>
                <span id="progressText" class="progress-text">0%</span>
            </div>
        </div>
    </div>

    <!-- 3. مستوعبات الأقسام المختلفة -->
    <div class="category-title">الوحدات السفلية</div>
    <div id="baseContainer" class="cards-container"></div>

    <div class="category-title">الوحدات العلوية</div>
    <div id="upperContainer" class="cards-container"></div>

    <div id="cornerContainer" class="cards-container"></div>
    <div id="tallContainer" class="cards-container"></div>
    <div id="framesContainer" class="cards-container"></div>
    <div id="claddingContainer" class="cards-container"></div>
    <div id="appliancesContainer" class="cards-container"></div>
    <div id="decorContainer" class="cards-container"></div>

    <script>
        // مصفوفة البيانات كما تأتي من components.json مع وجود الأقواس
        const globalComponentsList = [
            { name: "وحدة سفلية 2 ضلفة (سفلي)", cat: "base", hidden: false },
            { name: "وحدة سفلية 3 أدراج (سفلي)", cat: "base", hidden: false },
            { name: "وحدة علوية 2 ضلفة (علوي)", cat: "upper", hidden: false }
        ];

        const missingFilesList = []; // قائمة الملفات غير المحملة أوفلاين

        // دوال إنشاء رابط GitHub للـ SKP والصور بالاسم الكامل (شاملاً القوسين)
        function getSkpUrl(fileName) {
            return `https://raw.githubusercontent.com/username/repo/main/models/${encodeURIComponent(fileName)}.skp`;
        }

        function getImgUrl(fileName) {
            return `https://raw.githubusercontent.com/username/repo/main/images/${encodeURIComponent(fileName)}.png`;
        }

        // دالة رص المكونات داخل الواجهة
        function renderAllComponents(componentsList) {
            // تفريغ الأقسام قبل البدء
            ['upperContainer', 'baseContainer', 'cornerContainer', 'tallContainer', 'framesContainer', 'claddingContainer', 'appliancesContainer', 'decorContainer'].forEach(id => {
                const c = document.getElementById(id); if (c) c.innerHTML = '';
            });

            componentsList.forEach(item => {
                if (item.hidden) return;

                // 1. رابط جيت هاب يستخدم الاسم الكامل المخزن في ملف components.json
                const skpUrl = getSkpUrl(item.name);
                const imgUrl = getImgUrl(item.name);

                // 2. إزالة النص الموجود بين قوسين (...) من عنوان الكارت فقط
                const displayName = item.name.replace(/\s*\([^)]*\)/g, '').trim();

                const cardHTML = `
                    <div class="card" onclick="downloadAndInsert('${skpUrl}')" title="اضغط هنا لإدراج الوحدة في سكتش أب">
                        <img src="${imgUrl}" alt="${displayName}" onerror="this.src='https://via.placeholder.com/75/1e272e/ffd700?text=وحدة'">
                        <div class="info">
                            <h3>${displayName}</h3>
                            <p>مكون ديناميكي جاهز للبرنامج.</p>
                            <button class="dl-btn" onclick="event.stopPropagation(); downloadAndInsert('${skpUrl}')">📥 إدراج بالبرنامج</button>
                        </div>
                    </div>`;

                // 3. إضافة الكارت للقائمة المناسبة بناءً على التصنيف
                const container = document.getElementById(item.cat + 'Container');
                if (container) container.innerHTML += cardHTML;
            });
        }

        // دالة تنزيل المكتبة للعمل أوفلاين
        function downloadAllComponentsOffline() {
            const btn = document.getElementById('syncBtn');
            const wrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('syncProgress');
            const progressText = document.getElementById('progressText');

            // إظهار شريط التقدم فوراً عند الضغط
            btn.style.display = 'none';
            wrapper.style.display = 'block';
            progressBar.value = 0;
            progressText.innerText = `0% (جاري بدء التحميل...)`;

            // التفاعل مع SketchUp عبر Ruby أو العمل بالمحاكاة
            if (window.sketchup && window.sketchup.start_offline_download) {
                const filesToDownload = (missingFilesList && missingFilesList.length > 0) 
                    ? missingFilesList 
                    : globalComponentsList.map(item => getSkpUrl(item.name));
                    
                window.sketchup.start_offline_download(JSON.stringify(filesToDownload));
            } else {
                // محاكاة التحميل في حال الاختبار على متصفح عادي
                let current = 0;
                const total = globalComponentsList.length;
                const timer = setInterval(() => {
                    current++;
                    const percent = Math.round((current / total) * 100);
                    onDownloadProgress(current, total, percent);
                    
                    if (current >= total) {
                        clearInterval(timer);
                        onDownloadComplete();
                    }
                }, 400);
            }
        }

        function onDownloadProgress(current, total, percent) {
            const progressBar = document.getElementById('syncProgress');
            const progressText = document.getElementById('progressText');
            
            if (progressBar) progressBar.value = percent;
            if (progressText) progressText.innerText = `${percent}% (تم تحميل ${current} من ${total} وحدة)`;
        }

        function onDownloadComplete() {
            const btn = document.getElementById('syncBtn');
            const wrapper = document.getElementById('progressWrapper');
            const progressText = document.getElementById('progressText');
            
            if (progressText) progressText.innerText = '✅ تم حفظ جميع الوحدات أوفلاين بنجاح!';
            
            setTimeout(() => {
                if (wrapper) wrapper.style.display = 'none';
                if (btn) {
                    btn.innerText = '✅ المكتبة محمولة أوفلاين';
                    btn.style.background = '#22c55e';
                    btn.style.color = '#ffffff';
                    btn.style.display = 'inline-block';
                }
            }, 2000);
        }

        // دالة إدراج الوحدة داخل SketchUp
        function downloadAndInsert(url) {
            if (window.sketchup && window.sketchup.insert_component) {
                window.sketchup.insert_component(url);
            } else {
                console.log("جاري طلب إدراج الملف من الرابط:", url);
            }
        }

        // استدعاء دالة الرسم فور تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderAllComponents(globalComponentsList);
        });
    </script>
</body>
</html>
